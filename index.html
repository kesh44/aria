<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>carb &amp; insulin calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Beth+Ellen&family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Gaegu", cursive;
      font-weight: 400;
      margin: 1rem;
    }
    h1, h2 {
      font-family: "Beth Ellen", cursive;
      font-weight: 400;
    }
    input, select, button, textarea, table {
      font-family: inherit;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-start;
    }
    .box {
      border: 1px solid #000;
      padding: 0.75rem 1rem;
      box-sizing: border-box;
      flex: 1 1 280px;
      min-width: 0;
    }
    .box h2 {
      margin-top: 0;
    }
    .stack {
      margin-top: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>carb &amp; insulin calculator</h1>
    <p>uk metrics. pick a saved food, set the portion, and calculate. data saves to neon when the api is available.</p>
    <p id="status-msg"></p>

    <div class="row">
      <section class="box" id="calculate-box">
        <h2>calculate</h2>
        <form id="calc-form">
          <p>
            <label for="food-select">food</label><br>
            <select id="food-select" required></select>
          </p>
          <p>
            <label for="portion-g">portion (g)</label><br>
            <input type="number" id="portion-g" min="0" step="any" required>
          </p>
          <p>
            <label for="icr-select">icr</label><br>
            <select id="icr-select" required></select>
          </p>
          <p>
            <label for="note">note (optional)</label><br>
            <input type="text" id="note" maxlength="80">
          </p>
          <p>
            <button type="submit">calculate &amp; log</button>
            <button type="button" id="calc-clear">clear</button>
          </p>
        </form>
        <p id="result">no calculation yet.</p>
      </section>

      <section class="box" id="foods-panel"></section>
    </div>

    <section class="box stack" id="icr-panel"></section>
    <section class="box stack" id="log-panel"></section>
  </div>

  <script>
    (function () {
      function round(n, places) {
        var f = Math.pow(10, places);
        return Math.round(Number(n) * f) / f;
      }

      function toLocalInput(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        var pad = function (n) { return n < 10 ? "0" + n : String(n); };
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
          "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
      }

      function fromLocalInput(value) {
        if (!value) return new Date().toISOString();
        var d = new Date(value);
        return isNaN(d.getTime()) ? new Date().toISOString() : d.toISOString();
      }

      function formatWhen(iso) {
        try { return new Date(iso).toLocaleString("en-GB"); }
        catch (e) { return iso || ""; }
      }

      async function api(path, opts) {
        opts = opts || {};
        var res = await fetch(path, {
          method: opts.method || "GET",
          headers: { "Content-Type": "application/json" },
          body: opts.body != null ? JSON.stringify(opts.body) : undefined
        });
        var data = null;
        var text = await res.text();
        if (text) {
          try { data = JSON.parse(text); }
          catch (e) { data = { error: text }; }
        }
        if (!res.ok) {
          var err = new Error((data && data.error) || ("request failed (" + res.status + ")"));
          err.status = res.status;
          throw err;
        }
        return data;
      }

      function ApiStore(path) {
        var cache = [];

        return {
          all: function () { return cache.slice(); },
          get: function (id) {
            for (var i = 0; i < cache.length; i++) {
              if (cache[i].id === id) return cache[i];
            }
            return null;
          },
          load: async function () {
            cache = await api(path);
            if (!Array.isArray(cache)) cache = [];
            return cache.slice();
          },
          create: async function (data) {
            try {
              var row = await api(path, { method: "POST", body: data });
              cache.push(row);
              return { ok: true, row: row, items: cache.slice() };
            } catch (err) {
              return { ok: false, error: err.message };
            }
          },
          update: async function (id, data) {
            try {
              var row = await api(path, {
                method: "PUT",
                body: Object.assign({}, data, { id: id })
              });
              for (var i = 0; i < cache.length; i++) {
                if (cache[i].id === id) {
                  cache[i] = row;
                  break;
                }
              }
              return { ok: true, row: row, items: cache.slice() };
            } catch (err) {
              return { ok: false, error: err.message };
            }
          },
          remove: async function (id) {
            try {
              await api(path + "?id=" + encodeURIComponent(id), { method: "DELETE" });
              cache = cache.filter(function (row) { return row.id !== id; });
              return { ok: true, items: cache.slice() };
            } catch (err) {
              return { ok: false, error: err.message };
            }
          }
        };
      }

      function Crud(mount, config) {
        var store = config.store;
        var fields = config.fields;
        var creatable = config.creatable !== false;
        var editable = config.editable !== false;
        var clearable = config.clearable !== false && creatable;
        var editingId = null;
        var listeners = [];
        var form = null;
        var inputs = {};
        var submitBtn = null;
        var cancelBtn = null;

        var title = document.createElement("h2");
        title.textContent = config.title;
        mount.appendChild(title);

        if (creatable || editable) {
          form = document.createElement("form");
          if (!creatable) form.hidden = true;
          mount.appendChild(form);

          fields.forEach(function (field) {
            var p = document.createElement("p");
            var label = document.createElement("label");
            label.textContent = field.label + (field.optional ? " — optional" : "");
            p.appendChild(label);
            p.appendChild(document.createElement("br"));

            var input = document.createElement("input");
            input.type = field.type || "text";
            if (field.min != null) input.min = field.min;
            if (field.step != null) input.step = field.step;
            if (field.maxLength != null) input.maxLength = field.maxLength;
            if (field.required) input.required = true;
            input.name = field.key;
            inputs[field.key] = input;
            p.appendChild(input);
            form.appendChild(p);
          });

          var actions = document.createElement("p");
          submitBtn = document.createElement("button");
          submitBtn.type = "submit";
          submitBtn.textContent = "add";
          cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.textContent = "cancel";
          cancelBtn.hidden = true;
          actions.appendChild(submitBtn);
          actions.appendChild(document.createTextNode(" "));
          actions.appendChild(cancelBtn);
          if (clearable) {
            var clearBtn = document.createElement("button");
            clearBtn.type = "button";
            clearBtn.textContent = "clear";
            clearBtn.addEventListener("click", function () {
              resetForm();
              setMessage("");
            });
            actions.appendChild(document.createTextNode(" "));
            actions.appendChild(clearBtn);
          }
          form.appendChild(actions);

          form.addEventListener("submit", async function (ev) {
            ev.preventDefault();
            var parsed = readForm();
            if (!parsed.ok) {
              setMessage(parsed.error);
              return;
            }
            setMessage("saving…");
            var result = editingId
              ? await store.update(editingId, parsed.data)
              : await store.create(parsed.data);
            if (!result.ok) {
              setMessage(result.error);
              return;
            }
            setMessage(editingId ? "saved." : "added.");
            resetForm();
            render();
          });

          cancelBtn.addEventListener("click", function () {
            resetForm();
            setMessage("");
          });
        }

        var msg = document.createElement("p");
        mount.appendChild(msg);

        var table = document.createElement("table");
        table.border = "1";
        table.cellPadding = "4";
        table.cellSpacing = "0";
        var thead = document.createElement("thead");
        var headRow = document.createElement("tr");
        fields.forEach(function (field) {
          var th = document.createElement("th");
          th.textContent = field.label;
          headRow.appendChild(th);
        });
        headRow.appendChild(document.createElement("th"));
        thead.appendChild(headRow);
        table.appendChild(thead);
        var tbody = document.createElement("tbody");
        table.appendChild(tbody);
        mount.appendChild(table);

        function setMessage(text) {
          msg.textContent = text || "";
        }

        function readForm() {
          var data = {};
          for (var i = 0; i < fields.length; i++) {
            var field = fields[i];
            var raw = inputs[field.key].value;
            if (field.type === "number") {
              if (raw === "" || raw == null) {
                if (field.optional) data[field.key] = null;
                else return { ok: false, error: "please fill in " + field.label + "." };
              } else {
                var n = Number(raw);
                if (isNaN(n)) return { ok: false, error: "invalid number for " + field.label + "." };
                if (field.min != null && n < field.min) {
                  return { ok: false, error: field.label + " must be at least " + field.min + "." };
                }
                data[field.key] = field.places != null ? round(n, field.places) : n;
              }
            } else if (field.type === "datetime-local") {
              data[field.key] = fromLocalInput(raw);
            } else {
              var text = String(raw || "").trim();
              if (field.lower) text = text.toLowerCase();
              if (!text && !field.optional) {
                return { ok: false, error: "please fill in " + field.label + "." };
              }
              data[field.key] = text;
            }
          }
          if (config.validate) {
            var extra = config.validate(data, editingId, store.all());
            if (extra) return { ok: false, error: extra };
          }
          return { ok: true, data: data };
        }

        function fillForm(row) {
          fields.forEach(function (field) {
            var value = row[field.key];
            if (field.type === "datetime-local") inputs[field.key].value = toLocalInput(value);
            else if (value == null) inputs[field.key].value = "";
            else inputs[field.key].value = value;
          });
        }

        function resetForm() {
          editingId = null;
          if (!form) return;
          form.reset();
          if (!creatable) form.hidden = true;
          submitBtn.textContent = "add";
          cancelBtn.hidden = true;
          fields.forEach(function (field) {
            if (typeof field.defaultValue === "function") {
              if (field.type === "datetime-local") {
                inputs[field.key].value = toLocalInput(field.defaultValue());
              } else {
                inputs[field.key].value = field.defaultValue();
              }
            }
          });
        }

        function displayValue(field, row) {
          var value = row[field.key];
          if (field.format) return field.format(value, row);
          if (value == null || value === "") return "—";
          if (field.type === "datetime-local") return formatWhen(value);
          return value;
        }

        function sortedItems() {
          var items = store.all();
          if (config.sort) items.sort(config.sort);
          return items;
        }

        function render() {
          tbody.innerHTML = "";
          var items = sortedItems();
          items.forEach(function (row) {
            var tr = document.createElement("tr");
            fields.forEach(function (field) {
              var td = document.createElement("td");
              td.textContent = displayValue(field, row);
              tr.appendChild(td);
            });
            var tdAct = document.createElement("td");
            if (editable && form) {
              var editBtn = document.createElement("button");
              editBtn.type = "button";
              editBtn.textContent = "edit";
              editBtn.addEventListener("click", function () {
                editingId = row.id;
                form.hidden = false;
                fillForm(row);
                submitBtn.textContent = "save";
                cancelBtn.hidden = false;
                setMessage("editing — save or cancel.");
              });
              tdAct.appendChild(editBtn);
              tdAct.appendChild(document.createTextNode(" "));
            }
            var delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.textContent = "delete";
            delBtn.addEventListener("click", async function () {
              if (!window.confirm("delete this entry?")) return;
              setMessage("deleting…");
              var result = await store.remove(row.id);
              if (!result.ok) {
                setMessage(result.error);
                return;
              }
              if (editingId === row.id) resetForm();
              setMessage("deleted.");
              render();
            });
            tdAct.appendChild(delBtn);
            tr.appendChild(tdAct);
            tbody.appendChild(tr);
          });
          listeners.forEach(function (fn) { fn(items); });
        }

        if (form) resetForm();

        return {
          store: store,
          onChange: function (fn) { listeners.push(fn); },
          refresh: render,
          load: async function () {
            setMessage("loading…");
            try {
              await store.load();
              setMessage("");
              render();
              return true;
            } catch (err) {
              setMessage("offline / no api — " + err.message);
              render();
              return false;
            }
          },
          create: async function (data) {
            var result = await store.create(data);
            if (result.ok) render();
            return result;
          },
          all: function () { return store.all(); }
        };
      }

      function fillSelect(select, items, opts) {
        opts = opts || {};
        var previous = select.value;
        select.innerHTML = "";
        if (opts.blankLabel != null) {
          var blank = document.createElement("option");
          blank.value = "";
          blank.textContent = opts.blankLabel;
          select.appendChild(blank);
        }
        items.forEach(function (item) {
          var opt = document.createElement("option");
          opt.value = item.id;
          opt.textContent = opts.label(item);
          select.appendChild(opt);
        });
        if (previous && select.querySelector('option[value="' + previous + '"]')) {
          select.value = previous;
        } else if (opts.selectFirst && items.length) {
          select.value = items[0].id;
        }
      }

      var foods;
      var icrLog;
      var calcLog;
      var started = false;

      async function startApp() {
        if (started) {
          await Promise.all([foods.load(), icrLog.load(), calcLog.load()]);
          return;
        }
        started = true;

        foods = Crud(document.getElementById("foods-panel"), {
          title: "foods",
          store: ApiStore("/api/foods"),
          clearable: true,
          fields: [
            { key: "name", label: "name", type: "text", required: true, lower: true, maxLength: 60 },
            { key: "c100", label: "carbs / 100 g", type: "number", required: true, min: 0, step: "any", places: 2 },
            { key: "portion", label: "typical portion (g)", type: "number", optional: true, min: 0, step: "any", places: 2 }
          ],
          validate: function (data, editingId, items) {
            for (var i = 0; i < items.length; i++) {
              if (items[i].name === data.name && items[i].id !== editingId) {
                return "a food with that name already exists.";
              }
            }
            return null;
          },
          sort: function (a, b) { return a.name.localeCompare(b.name); }
        });

        icrLog = Crud(document.getElementById("icr-panel"), {
          title: "icr history",
          store: ApiStore("/api/icr"),
          clearable: true,
          fields: [
            {
              key: "from",
              label: "from",
              type: "datetime-local",
              required: true,
              defaultValue: function () { return new Date().toISOString(); }
            },
            { key: "icr", label: "icr (1 u : x g carbs)", type: "number", required: true, min: 0.1, step: "any", places: 2 },
            { key: "note", label: "note", type: "text", optional: true, lower: true, maxLength: 80 }
          ],
          sort: function (a, b) { return String(b.from).localeCompare(String(a.from)); }
        });

        calcLog = Crud(document.getElementById("log-panel"), {
          title: "calculation log",
          store: ApiStore("/api/log"),
          creatable: false,
          editable: false,
          fields: [
            { key: "t", label: "when", type: "datetime-local" },
            { key: "food", label: "food", type: "text" },
            { key: "c100", label: "carbs / 100 g", type: "number" },
            { key: "g", label: "portion (g)", type: "number" },
            { key: "carbs", label: "carbs (g)", type: "number" },
            { key: "icr", label: "icr", type: "number" },
            { key: "u", label: "insulin (u)", type: "number" },
            { key: "note", label: "note", type: "text" }
          ],
          sort: function (a, b) { return String(b.t).localeCompare(String(a.t)); }
        });

        var foodSelect = document.getElementById("food-select");
        var icrSelect = document.getElementById("icr-select");
        var portionInput = document.getElementById("portion-g");

        function clearCalc() {
          foodSelect.value = "";
          portionInput.value = "";
          document.getElementById("note").value = "";
          document.getElementById("result").textContent = "no calculation yet.";
          if (icrSelect.options.length) {
            icrSelect.selectedIndex = 0;
          }
        }

        foods.onChange(function (items) {
          fillSelect(foodSelect, items, {
            blankLabel: "— choose a food —",
            label: function (f) { return f.name; }
          });
        });

        icrLog.onChange(function (items) {
          fillSelect(icrSelect, items, {
            selectFirst: true,
            label: function (row) {
              return row.icr + " (from " + formatWhen(row.from) + ")" +
                (row.note ? " — " + row.note : "");
            }
          });
        });

        foodSelect.addEventListener("change", function () {
          var row = foods.store.get(foodSelect.value);
          if (!row) return;
          if (row.portion != null) portionInput.value = row.portion;
        });

        document.getElementById("calc-clear").addEventListener("click", clearCalc);

        document.getElementById("calc-form").addEventListener("submit", async function (ev) {
          ev.preventDefault();
          var foodRow = foods.store.get(foodSelect.value);
          var portionG = Number(portionInput.value);
          var icrRow = icrLog.store.get(icrSelect.value);
          var note = document.getElementById("note").value.trim().toLowerCase();

          if (!foodRow) {
            document.getElementById("result").textContent = "choose a saved food first.";
            return;
          }
          if (!icrRow || !(icrRow.icr > 0)) {
            document.getElementById("result").textContent = "add an icr entry first.";
            return;
          }
          if (!(portionG >= 0)) {
            document.getElementById("result").textContent = "please enter a valid portion.";
            return;
          }

          var carbPer100 = Number(foodRow.c100);
          var carbs = round((carbPer100 / 100) * portionG, 2);
          var units = round(carbs / icrRow.icr, 2);

          document.getElementById("result").textContent =
            foodRow.name + ": " + carbs + " g carbs. suggested insulin: " + units +
            " units (1 u covers " + icrRow.icr + " g carbs). check with your usual regimen before dosing.";

          var result = await calcLog.create({
            t: new Date().toISOString(),
            food: foodRow.name,
            c100: round(carbPer100, 2),
            g: round(portionG, 2),
            carbs: carbs,
            icr: round(icrRow.icr, 2),
            u: units,
            note: note
          });

          if (!result.ok) {
            document.getElementById("result").textContent += " (could not save log: " + result.error + ")";
          }
        });

        var loaded = await Promise.all([foods.load(), icrLog.load(), calcLog.load()]);
        var online = loaded.every(Boolean);
        document.getElementById("status-msg").textContent = online
          ? ""
          : "opened without the api (e.g. local file). ui works; saving needs the vercel deployment or `vercel dev`.";

        if (online && !icrLog.all().length) {
          await icrLog.create({
            from: new Date().toISOString(),
            icr: 10,
            note: "starting value"
          });
        }
      }

      startApp();
    })();
  </script>
</body>
</html>
