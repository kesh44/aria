<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carb &amp; insulin calculator</title>
</head>
<body>
  <h1>Carb &amp; insulin calculator</h1>
  <p>UK metrics. Enter carbs per 100 g, portion in grams, and your insulin-to-carb ratio (1 unit covers how many grams of carbohydrate).</p>

  <form id="calc-form">
    <p>
      <label for="carb-per-100">Carbs per 100 g (g)</label><br>
      <input type="number" id="carb-per-100" name="carb-per-100" min="0" step="any" required>
    </p>
    <p>
      <label for="portion-g">Portion (g)</label><br>
      <input type="number" id="portion-g" name="portion-g" min="0" step="any" required>
    </p>
    <p>
      <label for="icr">Insulin-to-carb ratio (1 unit : X g carbs)</label><br>
      <input type="number" id="icr" name="icr" min="0.1" step="any" required>
    </p>
    <p>
      <label for="note">Note (optional)</label><br>
      <input type="text" id="note" name="note" maxlength="80">
    </p>
    <p>
      <button type="submit">Calculate &amp; log</button>
    </p>
  </form>

  <h2>Result</h2>
  <p id="result">No calculation yet.</p>

  <h2>Log</h2>
  <p>
    <button type="button" id="clear-log">Clear log</button>
  </p>
  <table id="log-table" border="1" cellpadding="4" cellspacing="0">
    <thead>
      <tr>
        <th>When</th>
        <th>Carbs / 100 g</th>
        <th>Portion (g)</th>
        <th>Carbs (g)</th>
        <th>ICR</th>
        <th>Insulin (U)</th>
        <th>Note</th>
      </tr>
    </thead>
    <tbody id="log-body">
    </tbody>
  </table>

  <script>
    (function () {
      var COOKIE_ICR = "aria_icr";
      var COOKIE_LOG = "aria_log";
      // ~10 years — as permanent as cookies get
      var MAX_AGE = 60 * 60 * 24 * 365 * 10;
      // Stay under typical ~4 KB cookie limit (name + value + attrs)
      var MAX_LOG_CHARS = 3500;

      function setCookie(name, value, maxAge) {
        document.cookie =
          encodeURIComponent(name) +
          "=" +
          encodeURIComponent(value) +
          "; path=/; max-age=" +
          maxAge +
          "; SameSite=Lax";
      }

      function getCookie(name) {
        var key = encodeURIComponent(name) + "=";
        var parts = document.cookie.split(";");
        for (var i = 0; i < parts.length; i++) {
          var part = parts[i].trim();
          if (part.indexOf(key) === 0) {
            return decodeURIComponent(part.substring(key.length));
          }
        }
        return null;
      }

      function loadIcr() {
        var raw = getCookie(COOKIE_ICR);
        if (raw !== null && raw !== "" && !isNaN(Number(raw)) && Number(raw) > 0) {
          document.getElementById("icr").value = raw;
        } else {
          document.getElementById("icr").value = "10";
        }
      }

      function saveIcr(icr) {
        setCookie(COOKIE_ICR, String(icr), MAX_AGE);
      }

      function loadLog() {
        var raw = getCookie(COOKIE_LOG);
        if (!raw) return [];
        try {
          var parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function saveLog(entries) {
        // Drop oldest entries until the cookie fits
        var copy = entries.slice();
        while (copy.length > 0) {
          var value = JSON.stringify(copy);
          if (value.length <= MAX_LOG_CHARS) {
            setCookie(COOKIE_LOG, value, MAX_AGE);
            return copy;
          }
          copy.shift();
        }
        setCookie(COOKIE_LOG, "[]", MAX_AGE);
        return [];
      }

      function round(n, places) {
        var f = Math.pow(10, places);
        return Math.round(n * f) / f;
      }

      function formatWhen(iso) {
        try {
          return new Date(iso).toLocaleString("en-GB");
        } catch (e) {
          return iso;
        }
      }

      function renderLog(entries) {
        var tbody = document.getElementById("log-body");
        tbody.innerHTML = "";
        // Newest first
        for (var i = entries.length - 1; i >= 0; i--) {
          var e = entries[i];
          var tr = document.createElement("tr");
          var cells = [
            formatWhen(e.t),
            e.c100,
            e.g,
            e.carbs,
            e.icr,
            e.u,
            e.note || ""
          ];
          for (var j = 0; j < cells.length; j++) {
            var td = document.createElement("td");
            td.textContent = cells[j];
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
      }

      function calculate(carbPer100, portionG, icr) {
        var carbs = (carbPer100 / 100) * portionG;
        var units = carbs / icr;
        return {
          carbs: round(carbs, 2),
          units: round(units, 2)
        };
      }

      document.getElementById("calc-form").addEventListener("submit", function (ev) {
        ev.preventDefault();

        var carbPer100 = Number(document.getElementById("carb-per-100").value);
        var portionG = Number(document.getElementById("portion-g").value);
        var icr = Number(document.getElementById("icr").value);
        var note = document.getElementById("note").value.trim();

        if (!(carbPer100 >= 0) || !(portionG >= 0) || !(icr > 0)) {
          document.getElementById("result").textContent = "Please enter valid numbers. ICR must be greater than 0.";
          return;
        }

        var result = calculate(carbPer100, portionG, icr);
        saveIcr(icr);

        document.getElementById("result").textContent =
          "Carbs in portion: " +
          result.carbs +
          " g. Suggested insulin: " +
          result.units +
          " units (1 U covers " +
          icr +
          " g carbs). Check with your usual regimen before dosing.";

        var entries = loadLog();
        entries.push({
          t: new Date().toISOString(),
          c100: round(carbPer100, 2),
          g: round(portionG, 2),
          carbs: result.carbs,
          icr: round(icr, 2),
          u: result.units,
          note: note
        });
        entries = saveLog(entries);
        renderLog(entries);
      });

      document.getElementById("clear-log").addEventListener("click", function () {
        if (window.confirm("Clear the entire calculation log on this browser?")) {
          saveLog([]);
          renderLog([]);
        }
      });

      // Remember ICR when they tweak it (even before calculate)
      document.getElementById("icr").addEventListener("change", function () {
        var icr = Number(document.getElementById("icr").value);
        if (icr > 0) saveIcr(icr);
      });

      loadIcr();
      renderLog(loadLog());
    })();
  </script>
</body>
</html>
